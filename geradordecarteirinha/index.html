<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerador de Carteirinhas</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 0;
        padding: 20px;
        background-color: #343541;
        color: #d1d5db;
      }

      h1 {
        margin-bottom: 10px;
      }

      p.subtitle {
        margin-bottom: 20px;
        color: #a1a1aa;
      }

      #drop-area {
        border: 2px dashed #555;
        border-radius: 10px;
        width: 600px;
        height: 140px;
        line-height: 80px;
        color: #aaa;
        margin: 0 auto 20px auto;
        cursor: pointer;
        background-color: #444654;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: border-color 0.3s, color 0.3s;
      }

      #drop-area.hover {
        border-color: #10a37f;
        color: #10a37f;
      }

      #file-label {
        display: inline-flex;
        align-items: center;
        cursor: pointer;
        background-color: #444654;
        border: 1px solid #555;
        border-radius: 8px;
        padding: 8px 12px;
        margin-bottom: 20px;
        transition: background-color 0.3s, border-color 0.3s;
      }

      #file-label:hover {
        background-color: #555;
        border-color: #10a37f;
      }

      #file-label span {
        margin-left: 8px;
      }

      input[type="file"] {
        display: none;
      }

      #image-container {
        margin-top: 20px;
        display: flex;
        justify-content: center;
      }

      canvas {
        border: 1px solid #10a37f;
        max-width: 90%;
      }

      #generate-btn {
        margin-top: 20px;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        background-color: #10a37f;
        border: none;
        border-radius: 8px;
        color: white;
        transition: background-color 0.3s;
      }

      #generate-btn:hover {
        background-color: #0e8f6c;
      }
    </style>
  </head>
  <body>
    <h1>Gerador de Carteirinhas</h1>

    <div id="drop-area">Arraste sua imagem aqui</div>

    <label id="file-label">
      <strong>+</strong> <span>Carregar imagem</span>
      <input type="file" id="file-input" accept="image/*" />
    </label>

    <p class="subtitle">
      Selecione a parte da imagem que deseja usar para gerar sua carteirinha.
    </p>

    <div id="image-container">
      <canvas id="image-canvas"></canvas>
    </div>

    <button id="generate-btn" disabled>Gerar Carteirinha</button>

    <script>
      const dropArea = document.getElementById("drop-area");
      const canvas = document.getElementById("image-canvas");
      const ctx = canvas.getContext("2d");
      const generateBtn = document.getElementById("generate-btn");
      const fileInput = document.getElementById("file-input");

      let image = new Image();
      let startX,
        startY,
        endX,
        endY,
        isDragging = false;
      let crop = { x: 0, y: 0, width: 0, height: 0 };

      dropArea.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropArea.classList.add("hover");
      });

      dropArea.addEventListener("dragleave", () => {
        dropArea.classList.remove("hover");
      });

      dropArea.addEventListener("drop", (e) => {
        e.preventDefault();
        dropArea.classList.remove("hover");
        handleFile(e.dataTransfer.files[0]);
      });

      fileInput.addEventListener("change", (e) => {
        handleFile(e.target.files[0]);
      });

      function handleFile(file) {
        if (!file || !file.type.startsWith("image/")) return;

        const reader = new FileReader();
        reader.onload = function (event) {
          image.onload = () => {
            canvas.width = image.width;
            canvas.height = image.height;
            ctx.drawImage(image, 0, 0);
            generateBtn.disabled = false;
          };
          image.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }

      canvas.addEventListener("mousedown", (e) => {
        const rect = canvas.getBoundingClientRect();
        startX = e.clientX - rect.left;
        startY = e.clientY - rect.top;
        isDragging = true;
      });

      canvas.addEventListener("mousemove", (e) => {
        if (!isDragging) return;
        const rect = canvas.getBoundingClientRect();
        endX = e.clientX - rect.left;
        endY = e.clientY - rect.top;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(image, 0, 0);

        const width = endX - startX;
        const height = endY - startY;

        ctx.strokeStyle = "#10a37f";
        ctx.lineWidth = 2;
        ctx.strokeRect(startX, startY, width, height);
      });

      canvas.addEventListener("mouseup", () => {
        isDragging = false;
        crop.x = Math.min(startX, endX);
        crop.y = Math.min(startY, endY);
        crop.width = Math.abs(endX - startX);
        crop.height = Math.abs(endY - startY);
      });

      generateBtn.addEventListener("click", () => {
        if (!image.src) return;

        const croppedCanvas = document.createElement("canvas");
        croppedCanvas.width = crop.width;
        croppedCanvas.height = crop.height;
        const croppedCtx = croppedCanvas.getContext("2d");

        // Draw cropped image WITHOUT border
        croppedCtx.drawImage(
          image,
          crop.x,
          crop.y,
          crop.width,
          crop.height,
          0,
          0,
          crop.width,
          crop.height
        );

        const templateImage = new Image();
        templateImage.crossOrigin = "anonymous";
        templateImage.src =
          "https://mundodehads.github.io/geradordecarteirinha/template.png";

        templateImage.onload = () => {
          const finalCanvas = document.createElement("canvas");
          finalCanvas.width = templateImage.width;
          finalCanvas.height = templateImage.height;
          const finalCtx = finalCanvas.getContext("2d");

          finalCtx.drawImage(templateImage, 0, 0);

          finalCtx.drawImage(
            croppedCanvas,
            0,
            0,
            croppedCanvas.width,
            croppedCanvas.height,
            30,
            165,
            140,
            200
          );

          const finalImageUrl = finalCanvas.toDataURL("image/png");
          const printWindow = window.open("", "_blank");
          printWindow.document.write(
            `<img src="${finalImageUrl}" onload="window.print();">`
          );
        };
      });
    </script>
  </body>
</html>
